name: CI and Release

# WHY THIS FILE IS AT THE REPOSITORY ROOT
#
# GitHub Actions only discovers workflows in <repo-root>/.github/workflows/.
# This repository's root holds orc-plugin_hvd/ and research/, so the previous
# copy at orc-plugin_hvd/.github/workflows/ci.yml was never picked up — it had
# never run. Every `run:` step below therefore sets working-directory to the
# plugin subdirectory (where CMakeLists.txt lives) via the job-level `defaults`.
#
# NOTE: `defaults.run.working-directory` applies to `run:` steps ONLY. Steps
# using `uses:` (checkout, upload-artifact, download-artifact) resolve their
# paths against the workspace root regardless, which is why the artifact upload
# path below carries an explicit orc-plugin_hvd/ prefix.

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  # Fast hermetic job: numerical core + engine tests only (no decode-orc
  # SDK checkout, no Nix). Catches engine regressions — including the PAL
  # lock-in / effective-carrier tests — in ~2 minutes, before the full
  # matrix spends its time. Needs only cmake + g++ + fftw3f.
  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orc-plugin_hvd
    steps:
      - uses: actions/checkout@v4

      - name: Install FFTW (single precision)
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev cmake ninja-build

      - name: Configure (engine only)
        run: cmake -S . -B build-engine -G Ninja -DHVD_ENGINE_ONLY=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build-engine --parallel

      - name: Test
        run: ctest --test-dir build-engine --output-on-failure

  build-test-package:
    needs: engine-tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: orc-plugin_hvd
    env:
      ORC_SDK_DIR: ${{ github.workspace }}/decode-orc
      # Tracks the host's main branch, matching orc-plugin_skeleton. A pinned
      # tag would be more reproducible, but this plugin now includes
      # <orc/abi/orc_plugin_sdk.h> (the tiered SDK layout) and only an SDK
      # that ships the orc/abi/ tier will satisfy it. Re-pin to the earliest
      # tag containing orc/sdk/include/orc/abi/ once that is known; the
      # verification step below reports the available tiers on mismatch.
      ORC_SDK_REF: main
      ORC_CMAKE_ARGS: -DORC_INTREE_SDK_DIR=${{ github.workspace }}/decode-orc -DBUILD_TESTS=ON
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: so
            use_nix: true
          - os: macos-latest
            platform: macos
            ext: dylib
            use_nix: true
          - os: windows-latest
            platform: windows
            ext: dll
            use_nix: false

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout decode-orc host repository
        uses: actions/checkout@v4
        with:
          repository: simoninns/decode-orc
          ref: ${{ env.ORC_SDK_REF }}
          path: decode-orc

      - name: Install Nix
        if: matrix.use_nix
        uses: cachix/install-nix-action@v31

      - name: Verify SDK headers (POSIX)
        if: runner.os != 'Windows'
        run: |
          if [ ! -f "$ORC_SDK_DIR/orc/sdk/include/orc/abi/orc_plugin_sdk.h" ]; then
            echo "::error::SDK checkout '$ORC_SDK_REF' has no orc/abi/ tier."
            echo "This plugin includes <orc/abi/orc_plugin_sdk.h>."
            echo "Tiers present under orc/sdk/include/orc:"
            ls -1 "$ORC_SDK_DIR/orc/sdk/include/orc" || true
            exit 1
          fi
          test -f "$ORC_SDK_DIR/orc/sdk/include/orc/plugin/orc_stage_preview.h"
          test -f "$ORC_SDK_DIR/orc/sdk/include/orc/plugin/orc_stage_runtime.h"

      - name: Verify SDK headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ORC_SDK_DIR/orc/sdk/include/orc/abi/orc_plugin_sdk.h")) {
            Write-Host "::error::SDK checkout '$env:ORC_SDK_REF' has no orc/abi/ tier."
            Write-Host "Tiers present under orc/sdk/include/orc:"
            Get-ChildItem "$env:ORC_SDK_DIR/orc/sdk/include/orc" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host " - $($_.Name)" }
            throw "Missing orc/abi/orc_plugin_sdk.h in SDK checkout"
          }
          if (-not (Test-Path "$env:ORC_SDK_DIR/orc/sdk/include/orc/plugin/orc_stage_preview.h")) {
            throw "Missing orc_stage_preview.h in SDK checkout"
          }
          if (-not (Test-Path "$env:ORC_SDK_DIR/orc/sdk/include/orc/plugin/orc_stage_runtime.h")) {
            throw "Missing orc_stage_runtime.h in SDK checkout"
          }

      - name: Enforce SDK boundary
        shell: bash
        run: |
          chmod +x scripts/check_sdk_boundary.sh
          ./scripts/check_sdk_boundary.sh .

      - name: Configure (Nix)
        if: matrix.use_nix
        run: |
          nix develop --accept-flake-config --command \
            cmake -S . -B build $ORC_CMAKE_ARGS

      # No explicit `vcpkg install` step: vcpkg.json in this directory puts
      # vcpkg into manifest mode, so the toolchain file below installs fftw3
      # (with the threads feature) and fmt during configure.
      - name: Configure (native)
        if: ${{ !matrix.use_nix }}
        run: >
          cmake -S . -B build
          -DORC_INTREE_SDK_DIR=${{ env.ORC_SDK_DIR }}
          -DBUILD_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Nix)
        if: matrix.use_nix
        run: nix develop --accept-flake-config --command cmake --build build --config Release --parallel

      - name: Build (native)
        if: ${{ !matrix.use_nix }}
        run: cmake --build build --config Release --parallel

      - name: Test (Nix)
        if: matrix.use_nix
        run: nix develop --accept-flake-config --command ctest --test-dir build --output-on-failure -C Release

      - name: Test (native)
        if: ${{ !matrix.use_nix }}
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/package_local.sh
          ./scripts/package_local.sh build dist

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $candidate = Get-ChildItem -Path build -Recurse -File -Filter "*.dll" | Where-Object {
            $_.Name -like "orc-stage-plugin-hvd-chroma-decoder*.dll"
          } | Select-Object -First 1
          if (-not $candidate) {
            Write-Host "DLL candidates under build/:"
            Get-ChildItem -Path build -Recurse -File -Filter "*.dll" | ForEach-Object {
              Write-Host " - $($_.FullName)"
            }
          }
          if (-not $candidate) { throw 'Could not locate built plugin DLL' }
          Copy-Item $candidate.FullName "dist/orc-plugin_hvd_chroma_decoder_windows.dll"

      # `uses:` steps ignore working-directory, hence the explicit prefix.
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: orc-plugin_hvd/dist/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/orc-plugin_hvd_chroma_decoder_*
